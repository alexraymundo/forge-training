<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORGE | Acceso al cuestionario</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="standalone-access-body">
  <header class="site-header">
    <a href="/" class="brand">
      <img src="/assets/forge-logo.png" alt="FORGE">
    </a>
    <a href="/" class="outline-btn">Volver a inicio</a>
  </header>

  <main class="standalone-access">
    <div class="access-symbol">◆</div>
    <span class="kicker">ACCESO FORGE</span>
    <h1>Ingresa tu código</h1>
    <p>
      Después de aprobar tu transferencia, FORGE te proporcionará un código.
      Escríbelo exactamente como lo recibiste.
    </p>

    <div class="standalone-access-card">
      <label for="codeInput">Código de acceso</label>
      <input id="codeInput" type="text" autocomplete="off"
             placeholder="FORGE-XXXXXX" maxlength="20">
      <button class="gold-btn" id="validateCode">Continuar al cuestionario</button>
      <div id="codeStatus" class="code-status"></div>
    </div>

    <small class="access-help">
      Si ya pagaste pero aún no tienes código, contacta a FORGE con tu referencia de transferencia.
    </small>
  </main>

  <script>
    const codeInput = document.getElementById("codeInput");
    const validateButton = document.getElementById("validateCode");
    const statusEl = document.getElementById("codeStatus");

    async function validate() {
      const code = codeInput.value.trim().toUpperCase();

      if (!code) {
        statusEl.textContent = "Escribe tu código de acceso.";
        statusEl.className = "code-status error";
        return;
      }

      validateButton.disabled = true;
      validateButton.textContent = "Validando...";
      statusEl.textContent = "";

      try {
        const response = await fetch("/api/redeem-access-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.approved) {
          statusEl.textContent = data.error || "Código inválido.";
          statusEl.className = "code-status error";
          return;
        }

        sessionStorage.setItem("forgeQuestionnaireAccess", JSON.stringify({
          code,
          plan: data.plan,
          orderId: data.order_id,
          grantedAt: Date.now()
        }));

        statusEl.textContent = "Código válido ✓";
        statusEl.className = "code-status success";

        window.location.href = "/cuestionario.html";
      } catch (error) {
        console.error(error);
        statusEl.textContent = "No pudimos validar el código. Intenta otra vez.";
        statusEl.className = "code-status error";
      } finally {
        validateButton.disabled = false;
        validateButton.textContent = "Continuar al cuestionario";
      }
    }

    validateButton.addEventListener("click", validate);
    codeInput.addEventListener("keydown", e => {
      if (e.key === "Enter") validate();
    });
  </script>
</body>
</html>
