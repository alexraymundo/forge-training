<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORGE | Pagos</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{background:#050505;color:#fff}
    .admin-wrap{max-width:1050px;margin:0 auto;padding:60px 5%}
    .admin-login,.admin-order{border:1px solid rgba(230,173,46,.22);background:#090806;padding:22px;margin-top:18px}
    .admin-login input{width:100%;min-height:48px;background:#050505;border:1px solid rgba(230,173,46,.22);color:white;padding:0 12px;margin:12px 0}
    .admin-order{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
    .admin-order small,.admin-order span{display:block;color:#8f8a80}
    .admin-actions{display:flex;gap:8px;flex-wrap:wrap}
    .reject-btn{border:1px solid #6e5555;background:transparent;color:#d7a6a6;padding:10px 14px;cursor:pointer}
    @media(max-width:700px){.admin-order{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <span class="kicker">FORGE ADMIN</span>
    <h1>Validación de transferencias</h1>
    <p style="color:#938d84">Verifica el depósito directamente en tu banca antes de aprobar.</p>

    <section class="admin-login">
      <label>Clave de administrador</label>
      <input id="adminKey" type="password" autocomplete="current-password" placeholder="Ingresa tu clave">
      <button class="gold-btn" id="loadOrders">Entrar</button>
    </section>

    <section id="orders"></section>
  </main>

  <script>
    const keyInput = document.getElementById("adminKey");
    const ordersEl = document.getElementById("orders");

    async function loadOrders() {
      const key = keyInput.value;
      const r = await fetch("/api/admin/orders", {
        headers: { Authorization: `Bearer ${key}` }
      });
      const data = await r.json();
      if (!r.ok) {
        alert("Clave incorrecta o error al consultar.");
        return;
      }
      render(data.orders || []);
    }

    function render(orders) {
      ordersEl.innerHTML = orders.map(o => `
        <article class="admin-order">
          <div>
            <strong>${o.plan} · $${o.amount} MXN</strong>
            <span>Referencia: ${o.reference || "—"}</span>
            <span>Estado: ${o.status}</span>
            <span>Reportado por: ${o.reported_by || "—"}</span>
            <small>Orden: ${o.order_id}</small>
          </div>
          <div class="admin-actions">
            <button class="gold-btn" onclick="setStatus('${o.order_id}','approved')">Aprobar</button>
            <button class="reject-btn" onclick="setStatus('${o.order_id}','rejected')">Rechazar</button>
          </div>
        </article>
      `).join("");
    }

    async function setStatus(orderId, status) {
      if (!confirm(status === "approved" ? "¿Ya verificaste el depósito en el banco?" : "¿Marcar esta orden como rechazada?")) return;

      const r = await fetch("/api/admin/order-status", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${keyInput.value}`
        },
        body: JSON.stringify({ order_id: orderId, status })
      });

      if (!r.ok) {
        alert("No se pudo actualizar.");
        return;
      }
      loadOrders();
    }

    document.getElementById("loadOrders").addEventListener("click", loadOrders);
  </script>
</body>
</html>
